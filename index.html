<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Listening Room | Instrument Guide</title>
<meta name="description" content="Explore 17 instruments through photographs, demonstrations, and 34 featured compositions.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root{color-scheme:dark;--ink:#1b1917;--panel:#25221e;--cream:#f7efe1;--muted:#c9bdac;--gold:#eabd83;--line:#ffffff25}
*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--cream);font:16px/1.5 "DM Sans",sans-serif}button,a{font:inherit}a{color:var(--gold)}button{cursor:pointer;color:inherit;background:none;border:1px solid var(--line);border-radius:6px;padding:.6rem 1rem}button:disabled{opacity:.38;cursor:default}button:not(:disabled):hover,a:hover{color:#fff} :focus-visible{outline:2px solid var(--gold);outline-offset:4px}
main{width:min(1180px,94%);margin:auto;padding:26px 0}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:16px}.brand{font:28px "Instrument Serif",Georgia,serif}.brand span{color:var(--gold);margin-right:.55em}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:var(--gold)}.intro{color:var(--muted);margin:20px 0 12px}
nav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}nav button{min-width:0;padding:.42rem .75rem;font-size:14px}nav button[aria-current]{background:var(--gold);color:#25190f;border-color:transparent;font-weight:700}
.slide{display:grid;grid-template-columns: .92fr 1.08fr;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
figure{margin:0;position:relative;background:radial-gradient(ellipse at 50% 40%,#f7ecdb,#d5bca0);display:grid;grid-template-rows:minmax(300px,1fr) auto;min-width:0}figure img{width:100%;height:100%;min-height:0;object-fit:contain;position:absolute;inset:0;height:calc(100% - 48px);padding:26px 32px;mix-blend-mode:multiply}figcaption{grid-row:2;padding:12px 16px;background:#ede0cd;color:#4b3523;font-size:12px;z-index:1}figcaption a{color:#4b3523}
.info{padding:clamp(22px,4vw,52px)}h1{font:clamp(62px,8vw,105px)/.95 "Instrument Serif",Georgia,serif;margin:8px 0 16px;font-weight:400}.definition{font-size:17px;color:var(--muted);margin:0 0 24px;max-width:49ch}.demo{display:block;width:fit-content;margin-top:9px;font-size:14px}h2{font:30px "Instrument Serif",Georgia,serif;margin:0 0 8px;font-weight:400}.track{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;border-top:1px solid var(--line);text-decoration:none;padding:12px 0;color:var(--cream)}.track:hover strong{text-decoration:underline}.track strong{display:block;font-size:15px}.track small{display:block;color:var(--muted);margin-top:2px}.play{font-size:13px;color:var(--gold)}.listen{border-left:2px solid var(--gold);padding:0 0 0 13px;color:var(--muted);font-size:14px;margin:18px 0 0}.listen strong{color:var(--cream)}
footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;color:var(--muted);font-size:13px}.controls{display:flex;gap:8px}
@media(max-width:720px){.slide{grid-template-columns:1fr}figure{grid-template-rows:300px auto}.info{padding:24px}nav button{min-width:0;flex:1}.brand{font-size:24px}header .eyebrow{display:none}}
</style>
</head>
<body><main>
<header><div class="brand"><span aria-hidden="true">♫</span>The Listening Room</div><div class="eyebrow">Instrument guide</div></header>
<p class="intro">Choose an instrument, then hear it in two pieces of music.</p>
<nav aria-label="Choose an instrument"></nav>
<article class="slide" aria-labelledby="instrument"></article>
<footer><span id="position" role="status"></span><div class="controls"><button id="prev">← Previous</button><button id="next">Next →</button></div></footer>
<noscript>Enable JavaScript to browse the instrument slides.</noscript>
</main>
<script>
const youtube = id => 'https://www.youtube.com/watch?v=' + id;
const met = id => 'https://www.metmuseum.org/art/collection/search/' + id;
const photo = (id, image) => 'https://collectionapi.metmuseum.org/api/collection/v1/iiif/' + id + '/' + image + '/main-image';
const instruments = [
  {name:'Violin',family:'Strings',definition:'A high-pitched, four-string instrument held between the shoulder and chin. Drawing a bow across the strings makes them vibrate. The player can also pluck them.',
    image:'https://cdn.sanity.io/images/cctd4ker/production/c00ce5227d64a870c7c9a80111e56157246a9229-720x1051.jpg?auto=format&fit=clip&q=75&w=1200',
    credit:'Antonio Stradivari violin, 1693',source:'https://www.metmuseum.org/en/perspectives/meet-musical-instruments-galleries-families',
    pieces:[['Chaconne from Partita No. 2, BWV 1004','J. S. Bach · Hilary Hahn',youtube('ngjEVKxQCWs')],['“Spring” from The Four Seasons · I. Allegro','Antonio Vivaldi',youtube('2rx7FsjEpW4')]],
    cue:'In the Chaconne, listen for moments when the solo violin plays several notes together. In “Spring,” listen for the quick figures that sound like birdsong.'},
  {"name": "Viola", "family": "Strings", "definition": "A four-string instrument held on the shoulder and usually played with a bow. Its lowest string is a fifth below the violin’s lowest string, giving it a darker, lower sound.", "image": "https://upload.wikimedia.org/wikipedia/commons/c/cd/Bratsche.jpg", "credit": "Viola", "source": "https://commons.wikimedia.org/wiki/File:Bratsche.jpg", "sourceLabel": "Wikimedia Commons", "pieces": [["Walton Viola Concerto", "William Walton", "https://www.youtube.com/watch?v=9qr6GK_bftM"], ["Hindemith Der Schwanendreher", "Paul Hindemith", "https://www.youtube.com/watch?v=wPgmUji_bBM"]], "cue": "Compare Walton’s lyrical solo lines with the folk-song melodies in Hindemith. Can you hear the viola’s darker tone on its lower strings?"},
  {name:'Cello',family:'Strings',definition:'A four-string instrument played sitting down. It rests on an endpin between the player’s knees, and its long strings give it a lower range than the violin.',
    image:photo('503234','1023209'),credit:'Violoncello attributed to François-Louis Pique',source:met('503234'),
    pieces:[['Cello Suite No. 1 in G Major · Prélude','J. S. Bach · Yo-Yo Ma',youtube('6CegPCzP5HA')],['“The Swan” from The Carnival of the Animals','Camille Saint-Saëns · Yo-Yo Ma and Kathryn Stott',youtube('3qrKjywjo7Q')]],
    cue:'Compare the steady flow of short notes in the Prélude with the long, singing cello melody over the piano in “The Swan.”'},
  {"name": "Double Bass", "family": "Strings", "definition": "The largest and lowest-pitched instrument in the orchestral string section. The player stands or sits on a high stool and can bow the strings or pluck them.", "image": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d3/AGK_bass1_full.jpg/960px-AGK_bass1_full.jpg", "credit": "Orchestral double bass", "source": "https://commons.wikimedia.org/wiki/File:AGK_bass1_full.jpg", "sourceLabel": "Wikimedia Commons", "pieces": [["Double Bass Concerto No. 2 in B Minor", "Giovanni Bottesini", "https://www.youtube.com/watch?v=QgZ_-f7pVk4"], ["Double Bass Concerto in F-sharp Minor, Op. 3", "Serge Koussevitzky", "https://www.youtube.com/watch?v=e3_s_4J-EXg"]], "cue": "Listen for the change from deep bass notes to high, singing phrases. How high can the soloist make the bass sound?"},
  {name:'Flute',family:'Woodwinds',definition:'A woodwind held sideways. The player blows across the edge of a small opening to set the air inside the tube vibrating, then presses keys to change the pitch.',
    image:photo('503510','1025926'),credit:'Boehm & Mendler transverse flute, ca. 1870',source:met('503510'),
    pieces:[['Syrinx','Claude Debussy · Solo flute','https://guarnerihall.org/gh-vimeo-video/debussy-syrinx-played-john-thorne/'],['“Badinerie” from Orchestral Suite No. 2','J. S. Bach · Netherlands Bach Society',youtube('BsiqjGgwuU8')]],
    cue:'Hear how freely the flute stretches and pauses in Syrinx. Then tap along to the steady beat under the fast notes in “Badinerie.”'},
  {name:'Clarinet',family:'Woodwinds',definition:'A woodwind with a single thin reed attached to its mouthpiece. The reed vibrates as the player blows, and keys and finger holes help change the notes.',
    image:photo('503549','1653339'),credit:'Buffet, Crampon & Cie. clarinet, 1860–65',source:met('503549'),
    pieces:[['Clarinet Concerto in A Major, K. 622 · II. Adagio','W. A. Mozart · Martin Fröst',youtube('VpDq4Wu2f0A')],['Concertino in E-flat Major, Op. 26','Carl Maria von Weber · Ellen Considine','https://www.cpr.org/2016/08/26/watch-clarinetist-ellen-considine-tackles-webers-playful-concertino/']],
    cue:'Compare the smooth, connected melody in Mozart’s Adagio with the quick runs and changes of character in Weber’s Concertino.'},
  {"name": "Oboe", "family": "Woodwinds", "definition": "A woodwind played by blowing through a double reed. Two thin pieces of cane vibrate against each other, producing a focused sound that carries through the orchestra.", "image": "https://upload.wikimedia.org/wikipedia/commons/e/ea/Oboe_Patricola_Artista_PT1.jpg", "credit": "Patricola oboe", "source": "https://commons.wikimedia.org/wiki/File:Oboe_Patricola_Artista_PT1.jpg", "sourceLabel": "Wikimedia Commons", "pieces": [["Oboe Concerto in C Major, K. 314", "W. A. Mozart", "https://www.youtube.com/watch?v=gqEoNn2EBB0"], ["Oboe Concerto in D Major", "Richard Strauss", "https://www.youtube.com/watch?v=WvkY2Ovk6CU"]], "cue": "Listen for Mozart’s crisp, quick notes and Strauss’s long phrases. Where do you hear the soloist pause for breath?"},
  {"name": "Bassoon", "family": "Woodwinds", "definition": "A low woodwind with a long wooden tube folded back on itself. The player blows through a double reed attached to a curved metal tube called a bocal.", "image": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6f/FoxBassoon.png/960px-FoxBassoon.png", "credit": "Fox bassoon", "source": "https://commons.wikimedia.org/wiki/File:FoxBassoon.png", "sourceLabel": "Wikimedia Commons", "pieces": [["Bassoon Concerto in B-flat Major, K. 191", "W. A. Mozart", "https://www.youtube.com/watch?v=kQgLCsbaDk8"], ["Bassoon Concerto in F Major, Op. 75", "Carl Maria von Weber", "https://www.youtube.com/watch?v=TQny4biWHgE"]], "cue": "Listen for the bassoon’s short, playful notes and its smoother, singing upper register."},
  {"name": "Trumpet", "family": "Brass", "definition": "A high brass instrument sounded by buzzing the lips into a cup-shaped mouthpiece. Valves change the length of tubing the air passes through.", "image": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/12/Yamaha_Trumpet_YTR-8335LA_crop.jpg/1280px-Yamaha_Trumpet_YTR-8335LA_crop.jpg", "credit": "Yamaha trumpet", "source": "https://commons.wikimedia.org/wiki/File:Yamaha_Trumpet_YTR-8335LA_crop.jpg", "sourceLabel": "Wikimedia Commons", "pieces": [["Trumpet Concerto in E-flat Major, Hob. VIIe:1", "Joseph Haydn", "https://www.youtube.com/watch?v=V2q9Tf8wH4E"], ["Trumpet Concerto · E-flat Major version", "Johann Nepomuk Hummel", "https://www.youtube.com/watch?v=FQBrPIub5Yo"]], "cue": "Compare the trumpet’s bright entrances with the softer phrases. Listen for the clear start of each note."},
  {"name": "Trombone", "family": "Brass", "definition": "A brass instrument whose player buzzes into a mouthpiece and moves a slide to lengthen or shorten the tubing. The slide can also glide smoothly between notes.", "image": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f2/Yamaha_Tenor_trombone_YSL-891Z_%28re-crop%29.jpg/1280px-Yamaha_Tenor_trombone_YSL-891Z_%28re-crop%29.jpg", "credit": "Yamaha tenor trombone", "source": "https://commons.wikimedia.org/wiki/File:Yamaha_Tenor_trombone_YSL-891Z_%28re-crop%29.jpg", "sourceLabel": "Wikimedia Commons", "pieces": [["Concertino for Trombone, Op. 4", "Ferdinand David", "https://www.youtube.com/watch?v=_4NUrjmYtPQ"], ["Trombone Concerto", "Launy Grøndahl", "https://www.music.northwestern.edu/davee-gallery/video/grondahl-concerto-trombone"]], "cue": "Listen for the soloist’s sustained melody and the contrast when the trombone plays louder, more accented notes."},
  {"name": "Tuba", "family": "Brass", "definition": "A large, low-pitched brass instrument. The player buzzes into a wide mouthpiece and uses valves to change the length of its coiled tubing.", "image": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e5/Yamaha_Bass_tuba_YFB-822.tif/lossy-page1-500px-Yamaha_Bass_tuba_YFB-822.tif.jpg", "credit": "Yamaha bass tuba", "source": "https://commons.wikimedia.org/wiki/File:Yamaha_Bass_tuba_YFB-822.tif", "sourceLabel": "Wikimedia Commons", "pieces": [["Tuba Concerto in F Minor", "Ralph Vaughan Williams", "https://www.youtube.com/watch?v=SjkYVAfyhho"], ["Concerto for Tuba and Orchestra", "John Williams", "https://www.youtube.com/watch?v=GyiDwtve-LY"]], "cue": "Listen for how quickly the solo tuba can move between notes and how softly it can sing in the slower passages."},
  {"name": "Saxophone", "family": "Woodwinds", "definition": "A woodwind usually made of brass. The player blows through a mouthpiece with a single reed and uses keys to open and close holes in the body.", "image": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/97/Eight_saxophone_sizes_smaller.png/1280px-Eight_saxophone_sizes_smaller.png", "credit": "Saxophone family", "source": "https://commons.wikimedia.org/wiki/File:Eight_saxophone_sizes_smaller.png", "sourceLabel": "Wikimedia Commons", "pieces": [["Alto Saxophone Concerto in E-flat Major, Op. 109", "Alexander Glazunov", "https://www.youtube.com/watch?v=r0vedUyS9w0"], ["Rapsodie for Orchestra and Saxophone", "Claude Debussy", "https://www.youtube.com/watch?v=giCssJ9MyXo"]], "cue": "Follow the alto saxophone as its tone blends with the orchestra and then comes forward in a solo phrase."},
  {"name": "Timpani", "family": "Percussion", "definition": "Large bowl-shaped drums with stretched heads. Players strike them with mallets and can tune each drum to a specific pitch, often using a pedal.", "image": "https://upload.wikimedia.org/wikipedia/commons/0/02/USAFE_Band_timpanist.jpg", "credit": "Orchestral timpani", "source": "https://commons.wikimedia.org/wiki/File:USAFE_Band_timpanist.jpg", "sourceLabel": "Wikimedia Commons", "pieces": [["Symphony No. 103 “Drumroll” · I. Adagio", "Joseph Haydn", "https://www.youtube.com/watch?v=MnebHOkIiCk"], ["Symphony No. 9 · II. Molto vivace", "Ludwig van Beethoven", "https://www.youtube.com/watch?v=a8FnmdNi-Xc"]], "cue": "Haydn starts with a timpani roll. In Beethoven’s scherzo, listen for the drums answering the orchestra with distinct pitched strokes."},
  {"name": "Gong", "family": "Percussion", "definition": "A suspended metal disc struck with a padded mallet. The orchestral tam-tam is a type of gong that produces a broad wash of sound which swells and fades.", "image": "https://upload.wikimedia.org/wikipedia/commons/7/76/COLLECTIE_TROPENMUSEUM_Gong_hangend_in_een_standaard_onderdeel_van_gamelan_Semar_Pagulingan_TMnr_1340-13.jpg", "credit": "Suspended Balinese gong", "source": "https://commons.wikimedia.org/wiki/File:COLLECTIE_TROPENMUSEUM_Gong_hangend_in_een_standaard_onderdeel_van_gamelan_Semar_Pagulingan_TMnr_1340-13.jpg", "sourceLabel": "Wikimedia Commons", "pieces": [["The Planets · “Mars, the Bringer of War”", "Gustav Holst", "https://www.youtube.com/watch?v=xZfIUz1S97U"], ["Turandot · Act I", "Giacomo Puccini", "https://www.youtube.com/watch?v=azSR-YqBzFg"]], "cue": "Listen for the tam-tam’s spreading sound in Holst. In the closing scene of Act I of Turandot, listen for the gong strokes as the prince accepts the challenge."},
  {"name": "Triangle", "family": "Percussion", "definition": "A metal bar bent into a triangle with one corner open. It hangs freely and rings when struck with a metal beater.", "image": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4a/Triangle_001.jpg/1280px-Triangle_001.jpg", "credit": "Triangle and beater", "source": "https://commons.wikimedia.org/wiki/File:Triangle_001.jpg", "sourceLabel": "Wikimedia Commons", "pieces": [["Piano Concerto No. 1 · III. Allegretto vivace", "Franz Liszt", "https://commons.wikimedia.org/wiki/File:Liszt;_piano_concerto_No._1,_3._allegro_Vivace.ogg"], ["Symphony No. 4 · III. Allegro giocoso", "Johannes Brahms", "https://www.youtube.com/watch?v=jXUrxTOtP_Y"]], "cue": "Listen for the triangle near the start of Liszt’s third movement. In Brahms, see if you can hear its bright ring through the full orchestra."},
  {"name": "Grand Piano", "family": "Keyboards", "definition": "A keyboard instrument with horizontal strings inside a wing-shaped case. Pressing a key makes a felt-covered hammer strike a string. The pedals can change how long the sound rings.", "image": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/01/Steinway_Vienna_002.JPG/1280px-Steinway_Vienna_002.JPG", "credit": "Steinway grand piano", "source": "https://commons.wikimedia.org/wiki/File:Steinway_Vienna_002.JPG", "sourceLabel": "Wikimedia Commons", "pieces": [["Nocturne in E-flat Major, Op. 9 No. 2", "Frédéric Chopin", "https://www.youtube.com/watch?v=9E6b3swbnWg"], ["“Clair de lune” from Suite bergamasque", "Claude Debussy", "https://www.youtube.com/watch?v=4-6JVJ1oXRM"]], "cue": "Compare Chopin’s decorated melody over a steady left hand with the overlapping, gently ringing chords in Debussy."},
  {"name": "Organ", "family": "Keyboards", "definition": "A pipe organ sends pressurized air through pipes. The player uses hand keyboards and a pedalboard, and selects groups of pipes called stops to change the sound.", "image": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/36/Neunkirchen_am_Brand_Kirche_Orgel-20210411-RM-155230.jpg/1280px-Neunkirchen_am_Brand_Kirche_Orgel-20210411-RM-155230.jpg", "credit": "Pipe organ in Neunkirchen am Brand", "source": "https://commons.wikimedia.org/wiki/File:Neunkirchen_am_Brand_Kirche_Orgel-20210411-RM-155230.jpg", "sourceLabel": "Wikimedia Commons", "pieces": [["Toccata and Fugue in D Minor, BWV 565", "Attributed to J. S. Bach", "https://www.youtube.com/watch?v=ATbMw6X3T40"], ["Organ Symphony No. 5 · V. Toccata", "Charles-Marie Widor", "https://www.youtube.com/watch?v=0AgFs9zqEAA"]], "cue": "Listen for low notes played by the feet and faster notes played by the hands. In Widor, try following the pedal melody beneath the repeated chords."}
];
const demoLinks = {"Gong": "https://vimeo.com/42131443", "Triangle": "https://www.pbs.org/video/meet-unpitched-percussion-musicians-xdco2k/", "Grand Piano": "https://www.ptg.org/teacher-resources/how-does-a-piano-work", "Organ": "https://www.pbs.org/video/how-a-pipe-organ-works-mjhum0/"};
const nav=document.querySelector('nav');
const slide=document.querySelector('.slide');
const prev=document.querySelector('#prev');
const next=document.querySelector('#next');
const tabs=instruments.map((instrument,index)=>{
  const button=document.createElement('button');
  button.textContent=instrument.name;
  button.onclick=()=>show(index);
  nav.append(button);
  return button;
});
let current=0;
function show(index){
  if(index<0 || index>=instruments.length) return;
  current=index;
  const item=instruments[index];
  tabs.forEach((tab,i)=>i===index?tab.setAttribute('aria-current','true'):tab.removeAttribute('aria-current'));
  prev.disabled=index===0;
  next.disabled=index===instruments.length-1;
  document.querySelector('#position').textContent='Slide '+(index+1)+' of '+instruments.length;
  slide.innerHTML=`
    <figure><img src="${item.image}" alt="${item.credit}">
    <figcaption>${item.credit} · <a href="${item.source}" target="_blank" rel="noopener">${item.sourceLabel || 'The Met'} ↗</a></figcaption></figure>
    <div class="info"><div class="eyebrow">${item.family}</div><h1 id="instrument">${item.name}</h1>
    <p class="definition">${item.definition}
    <a class="demo" href="${demoLinks[item.name] || 'https://philharmonia.co.uk/resources/instruments/' + item.name.toLowerCase().replaceAll(' ', '-') + '/'}" target="_blank" rel="noopener">Watch how it’s played ↗</a></p><h2>Featured compositions</h2>
    ${item.pieces.map(([title,credit,url],i)=>`<a class="track" href="${url}" target="_blank" rel="noopener"><span class="play" aria-hidden="true">0${i+1}</span><span><strong>${title}</strong><small>${credit}</small></span><span class="play">Listen ↗</span></a>`).join('')}
    <p class="listen"><strong>Listen for it.</strong> ${item.cue}</p></div>`;
}
prev.onclick=()=>show(current-1);
next.onclick=()=>show(current+1);
document.addEventListener('keydown',event=>{
  if(event.altKey||event.ctrlKey||event.metaKey||event.shiftKey) return;
  if(event.key==='ArrowLeft') show(current-1);
  if(event.key==='ArrowRight') show(current+1);
});
show(0);
</script></body></html>
